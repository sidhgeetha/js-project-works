<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Tasks</title>
    <link rel="icon" type="image/svg+xml" href="/LogosJavascript.svg" /> <script
      src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 shadow-md">
      <div class="container mx-auto px-4 flex justify-between">
        <h1 class="text-2xl font-bold">JS-Tasks <span id="byBtn"
            class="bg-red-400 text-white p-2">By</span></h1>

        <form class="flex flex-row gap-6 items-center text-center">
          <div>
            <input type="text" class="rounded-md p-1  " placeholder="name" >
          </div>
          <div>
            <label for="terms">
              <input type="checkbox" id="terms"> i accept the
              <a class="border-b" href="https://google.com"
                onclick="return false">terms and conditions</a>
              <!-- onclick ="event.preventDefault()" -->
            </label>
          </div>
          <div><button class="bg-amber-200 rounded p-1 text-black text-sm font-light">SUBMIT</button></div>
        </form>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-white py-16">
      <div class="container mx-auto px-4 text-center">

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <a href="https://hp-list-dom.netlify.app/"
            class="block bg-blue-100 hover:bg-blue-200 text-blue-800 font-medium py-6 rounded shadow">
            High-perfomance-list
          </a>
          <a href="https://activestate-navlinks.netlify.app/"
            class="block bg-green-100 hover:bg-green-200 text-green-800 font-medium py-6 rounded shadow">
             Dynamic User Manager
          </a>
          <a href="https://add-dynamic-user.netlify.app/"
            class="block bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-medium py-6 rounded shadow">
           Active State Navigator
          </a>
          <a href="https://greeting-bot.netlify.app/"
            class="block bg-pink-100 hover:bg-pink-200 text-pink-800 font-medium py-6 rounded shadow">
           The "Greeting" Bot
          </a>
          <a href="#"
            class="block bg-purple-100 hover:bg-purple-200 text-purple-800 font-medium py-6 rounded shadow">
             Background Color Switcher
          </a>
        </div>
      </div>
    </section>


    <script src="./src/main.js"></script>
  </body>
</html>
